name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Verify release version
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict"; import pkg from "./package.json" with { type: "json" }; assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);'
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - run: npm ci
      - run: npm run check
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack --ignore-scripts
          package_file="codex-web-${GITHUB_REF_NAME#v}.tgz"
          sha256sum "$package_file" > "$package_file.sha256"
          gh release create "$GITHUB_REF_NAME" "$package_file" "$package_file.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Codex Web $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --latest
